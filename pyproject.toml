[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "synthetic-data-generator"
version = "0.1.0"
description = "Synthetic data generation and evaluation pipeline for Home DIY repair Q&A"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "instructor>=1.15.1",
    "logfire[openai]>=4.33.0",
    "openai>=1.0.0",
    "pydantic>=2.13.3",
    "python-dotenv>=1.0.0",
    "rapidfuzz>=3.14.5",
    "rich>=14.3.4",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "streamlit>=1.58.0",
]

[dependency-groups]
dev = [
    "isort>=8.0.1",
]
